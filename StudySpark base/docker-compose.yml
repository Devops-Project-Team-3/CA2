services:
  backend:
    build:
      context: ./backend
    container_name: studyspark-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: studyspark-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    restart: unless-stopped
