services:
  backend:
    build:
      context: ./backend
      target: runtime
    container_name: studyspark-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_API_BASE_URL: ""
    container_name: studyspark-frontend
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

  backend-test:
    build:
      context: ./backend
      target: test
    profiles:
      - test

  frontend-test:
    build:
      context: ./frontend
      target: test
      args:
        VITE_API_BASE_URL: ""
    profiles:
      - test
