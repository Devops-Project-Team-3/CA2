name: StudySpark Deployment

on:
  push:
    branches:
      - main # Trigger only when code lands on main

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: "./StudySpark base/backend"
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/studyspark-backend:latest
            ghcr.io/${{ github.repository_owner }}/studyspark-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: "./StudySpark base/frontend"
          build-args: |
            VITE_API_BASE_URL=http://localhost:5000
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/studyspark-frontend:latest
            ghcr.io/${{ github.repository_owner }}/studyspark-frontend:${{ github.sha }}

  trigger-deploy:
    name: Trigger Live Cloud Deployment
    runs-on: ubuntu-latest
    needs: docker-publish # Ensures this only runs after images are built & pushed successfully
    steps:
      - name: Call Cloud Deploy Webhooks
        run: |
          curl -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          curl -X POST ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}