name: StudySpark CI

on:
  push:
    branches:
      - main
      - development

  pull_request:
    branches:
      - main
      - development

  workflow_dispatch:

permissions:
  contents: read

# Cancel the previous run when new commits are pushed to the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "StudySpark base/frontend"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "StudySpark base/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: studyspark
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: "StudySpark base/backend"

    env:
      NODE_ENV: test

      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: test-password
      DB_NAME: studyspark
      DB_SSL: "false"

      JWT_SECRET: ci-only-jwt-secret-do-not-use-in-production

      # Tests should mock Gemini instead of contacting the real API.
      GEMINI_API_KEY: test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "StudySpark base/backend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Set up test database
        run: npm run db:setup

      - name: Run backend tests
        run: npm test

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build \
            --tag studyspark-backend:ci \
            "./StudySpark base/backend"

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL= \
            --tag studyspark-frontend:ci \
            "./StudySpark base/frontend"
